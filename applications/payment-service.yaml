apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-service-prod
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  project: default
  source:
    path: overlays/prod
    repoURL: https://github.com/praveenkumar0031/ex-3.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      selfHeal: false # This prevents the drift we investigated!
      prune: true